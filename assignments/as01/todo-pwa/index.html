<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My To-Do</title>
    <meta name="description" content="A simple offline to-do list that stores tasks on your device." />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />

    <!-- iPhone / iPad home-screen support -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="To-Do" />

    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>My To-Do</h1>
      <p class="tagline">Saved on this device. Works offline.</p>
    </header>

    <main class="container">
      <p id="storage-error" class="banner banner-error" role="alert" hidden></p>

      <section class="card" aria-labelledby="form-heading">
        <h2 id="form-heading">Add task</h2>
        <form id="task-form" novalidate>
          <div class="field field-wide">
            <label for="title">Title <span class="required" aria-hidden="true">*</span></label>
            <input id="title" name="title" type="text" required maxlength="200" autocomplete="off" aria-describedby="title-error" />
            <p id="title-error" class="field-error" hidden>Please enter a title.</p>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="field">
            <label for="project">Project</label>
            <input id="project" name="project" type="text" maxlength="100" autocomplete="off" />
          </div>

          <div class="field">
            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="datetime-local" />
          </div>

          <div class="field">
            <label for="contact">Contact person</label>
            <input id="contact" name="contact" type="text" maxlength="100" autocomplete="off" />
          </div>

          <div class="field field-wide">
            <label for="location">Location</label>
            <input id="location" name="location" type="text" maxlength="100" autocomplete="off" />
          </div>

          <div class="form-actions field-wide">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add task</button>
            <button type="button" id="cancel-edit-btn" class="btn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="card toolbar" aria-label="Sort and filter">
        <div class="sort-controls">
          <label for="sort-field">Sort by</label>
          <select id="sort-field">
            <option value="priority">Priority</option>
            <option value="project">Project</option>
            <option value="deadline">Deadline</option>
            <option value="contact">Contact person</option>
            <option value="location">Location</option>
          </select>
          <button type="button" id="sort-dir-btn" class="btn" aria-label="Sort direction: ascending">↑ Asc</button>
        </div>

        <div class="filter-controls" role="group" aria-label="Show tasks">
          <button type="button" class="btn filter-btn" data-filter="all" aria-pressed="true">All (<span data-count="all">0</span>)</button>
          <button type="button" class="btn filter-btn" data-filter="active" aria-pressed="false">Not done (<span data-count="active">0</span>)</button>
          <button type="button" class="btn filter-btn" data-filter="done" aria-pressed="false">Done (<span data-count="done">0</span>)</button>
        </div>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="visually-hidden">Tasks</h2>
        <p id="empty-message" class="empty-message" role="status" hidden></p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>

    <template id="task-template">
      <li class="task">
        <div class="task-main">
          <input type="checkbox" class="task-done" />
          <div class="task-body">
            <div class="task-heading">
              <h3 class="task-title"></h3>
              <span class="priority-badge"></span>
            </div>
            <p class="countdown"></p>
            <dl class="task-meta">
              <div><dt>Project</dt><dd data-field="project"></dd></div>
              <div><dt>Deadline</dt><dd data-field="deadline"></dd></div>
              <div><dt>Contact</dt><dd data-field="contact"></dd></div>
              <div><dt>Location</dt><dd data-field="location"></dd></div>
            </dl>
          </div>
        </div>
        <div class="task-actions">
          <button type="button" class="btn btn-small" data-action="edit">Edit</button>
          <button type="button" class="btn btn-small btn-danger" data-action="delete">Delete</button>
        </div>
      </li>
    </template>

    <noscript><p class="container">This app needs JavaScript to run.</p></noscript>
  </body>
</html>
